# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. ENVIRONMENTS.md owns paired release acceptance.
name: Deploy production
on:
  # Shared: production is manually dispatched from main, never automatic on merge.
  # Project: adopt the backend migration first; release a compatible backend/frontend
  # pair with its own exact SHA per repository, Worker first when both change.
  workflow_dispatch:
    inputs:
      # Shared: full merged FRONTEND SHA with retained successful dev-delivery evidence.
      # Project: workerSha/API-schema pins do not select backend release tooling.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: read source ancestry and same-repository Actions evidence; no write PAT.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: require exact-SHA dev evidence before checking the production candidate.
  # Project: ci:integration retains fixtures/contract/Chromium vertical checks;
  # ci:quality then builds with production API/OpenAPI public inputs, and ci:browser
  # tests those release bytes in all three engines (playwright.release.config.ts).
  # Fixture bundles are not deployable release evidence. Different target inputs
  # can produce different frontend bytes from the same accepted source revision.
  # Shared: verification has no deployment secrets; its artifact is retained intact.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@1d73e4b1124ca2a065cf748d52747ffb63a014e9
    with:
      # Shared: use the same immutable implementation and reusable workflow SHA.
      automation_sha: 1d73e4b1124ca2a065cf748d52747ffb63a014e9
      source_sha: ${{ inputs.sha }}
      # Project public inputs come from .github/ci-cd.json buildEnvironment.production.
      environment: production
      node_version: '24'
  # Shared: verification precedes the called production environment approval gate.
  # GitHub settings own required reviewers, main-only access and disabled admin bypass.
  # After approval, recheck dev evidence/source/artifact identity and enablement;
  # serialize production mutations without cancelling an active deployment.
  # Project: ci-deploy.mjs uploads the checked Vercel output without a provider build,
  # checks release identity/public API/CORS and retains immutable/prior identities.
  # It does not deploy/refresh the backend or certify human acceptance of the pair.
  # A failed/uncertain release requires investigation and a fresh dispatch/approval,
  # not a job rerun, blind retry or automatic rollback.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@1d73e4b1124ca2a065cf748d52747ffb63a014e9
    with:
      automation_sha: 1d73e4b1124ca2a065cf748d52747ffb63a014e9
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '24'
    # Shared: production provider credentials only, not dev credentials or extra PATs.
    # Verification does not receive these; SMOKE_BYPASS is optional protected-URL access.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
