name: Green documentation merge

on:
  workflow_run:
    workflows: [Merge eligibility (dry run)]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Existing user-guide prose PR to evaluate and merge
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: iris-green-merger
  cancel-in-progress: false

jobs:
  merge:
    if: vars.IRIS_GREEN_MERGE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: iris-green-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create repository-scoped merge token
        id: merge-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.IRIS_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.IRIS_MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: iris-frontend
          permission-contents: write
          permission-pull-requests: read
          permission-actions: read
          permission-statuses: read
          permission-administration: read
      # No candidate checkout, dependencies, artifacts, PR prose or shell interpolation.
      - name: Evaluate fresh evidence and request a protected merge
        env:
          GH_TOKEN: ${{ github.token }}
          IRIS_GREEN_MERGE_ENABLED: ${{ vars.IRIS_GREEN_MERGE_ENABLED }}
          IRIS_MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
          IRIS_REQUESTED_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$IRIS_REQUESTED_PR" ]; then
            IRIS_PR="$IRIS_REQUESTED_PR" node scripts/merge-green.mjs
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json number --jq '.[].number' > "$RUNNER_TEMP/iris-prs"
            status=0
            while read -r number; do
              if ! out="$(IRIS_PR="$number" node scripts/merge-green.mjs)"; then
                status=1
                continue
              fi
              printf '%s\n' "$out"
              case "$out" in *'"state":"merged"'*) break ;; esac
            done < "$RUNNER_TEMP/iris-prs"
            exit "$status"
          fi
