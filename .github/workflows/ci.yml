# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. See ENVIRONMENTS.md for operations.
# Shared foundation owns release safeguards; Iris owns API/UI compatibility checks.
name: CI
on:
  # Shared: PRs verify only. Required checks/current-head reviews gate human merge.
  pull_request: null
  # Shared: a main push rechecks the exact merged source before automatic dev.
  push:
    branches:
      - main
  # Shared: manually revalidate/redeliver an exact merged SHA to dev only.
  # Production uses deploy-production.yml; there is no arbitrary target selector.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
# Shared: read source and retained Actions evidence; no merge/admin writes.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: pinned web verification invokes the project's ci:* package hooks.
  # Project: ci:integration first runs account-enabled three-engine fixtures,
  # generated-contract checks and the Chromium frontend/Worker vertical suite.
  # Project: .github/ci-cd.json workerSha selects the compatible test Worker;
  # it does not select backend release tooling or dispatch a backend deployment.
  # Project: ci:quality applies lint/types/unit/policy/tooling/version/audit checks
  # and builds with the declared target's public API/OpenAPI inputs.
  # Project: ci:browser tests that deployable output in all three engines using
  # playwright.release.config.ts; fixture output is not the release artifact.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      # Shared: use identical immutable workflow and implementation revisions.
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      # Shared: explicit manual SHA, otherwise the exact PR/main event revision.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: frontend runtime; the compatible Worker has its own Node setting.
      node_version: '24'
  # Shared: only successful main push/manual dev runs can enter delivery.
  # The called job binds dev, checks enablement/artifact integrity/freshness and
  # serializes target mutations, retaining exact-SHA delivery/smoke evidence.
  # Project: scripts/ci-deploy.mjs handles prebuilt Vercel delivery and public
  # API/CORS smoke. This is frontend delivery, not coordinated backend promotion.
  # The backend-first migration/release prerequisites remain in ENVIRONMENTS.md.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '24'
    # Shared: named provider secrets only; verification receives no deploy token.
    # The called deploy job uses the selected GitHub environment's configuration.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
  # Project: retain both native required-check names, test-and-build and vertical.
  # Shared: these always-running result bridges fail when verify fails and do not
  # execute a second build or integration suite. Do not remove without gate migration.
  legacy_0:
    name: test-and-build
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
  legacy_1:
    name: vertical
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
